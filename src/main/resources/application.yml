server:
  port: 9000
  # This server sits behind work-mcp-gateway, which is the public origin (:8081). PreserveHostHeader
  # on the gateway's auth route forwards Host: localhost:8081; this strategy lets Tomcat honour
  # X-Forwarded-Proto (scheme fix-up behind TLS termination). Harmless in http dev.
  forward-headers-strategy: native
  # Surface the actual error reason on the global /error page. Unrecoverable authorization errors
  # (unknown client_id, untrusted redirect_uri) that can't be sent back to the client land here; the
  # default (never) renders only an opaque "Bad Request" Whitelabel page, which reads as a bare 404
  # to someone debugging `claude mcp auth`. DEV posture — a prod error page would sanitize this.
  error:
    include-message: always
    include-exception: true

app:
  # The authorization-server issuer = the public origin (the gateway in front of this server), not
  # this server's internal :9000. Stamped as the token `iss` and advertised in discovery metadata.
  issuer: http://localhost:8081
  # HTTP request header that a trusted gateway/proxy injects to identify the already-authenticated user.
  # That gateway is work-mcp-gateway, which now injects it on the /oauth2/authorize flow.
  header:
    name: X-Account-Id
  # When the header is missing or the account is unknown, unauthenticated requests are redirected here
  # with a "${return-to-param}=<original URL>" query so the SSO can send the user back after login.
  sso:
    # Dev: point at the gateway's mock-SSO (MockSsoLoginController on :8081) so an unauthenticated
    # authorize call completes the OAuth dance on the public origin instead of bouncing to the
    # unimplemented sso.example.com stub. Prod overrides this with the real SSO URL.
    login-url: http://localhost:8081/dev-sso/login
    return-to-param: return_to
  # MCP authorization: the MCP server's resource identifier. Becomes the access-token `aud`
  # (RFC 8707 audience) and the sole allowed `resource` request parameter value.
  mcp:
    resource: http://localhost:8081
  # Dynamic Client Registration (RFC 7591) housekeeping: idle dynamic registrations are reaped after
  # this (a registration read in the meantime stays alive); pre-registered website apps are exempt.
  dcr:
    evict-unused-after: 1h
  # Website apps (FR-15): pre-registered confidential clients, NOT via open DCR. Sign-in runs the
  # OAuth 2.1 standard authorization code + PKCE + consent flow — the id+secret only AUTHENTICATES
  # the client when redeeming the user's code (no client_credentials grant). Dev-grade: secrets are
  # in config verbatim — production verifies them via the external client registry below
  # (docs/architecture.md §9).
  web-clients:
    - client-id: web-app-demo
      client-secret: web-demo-secret
      client-name: Demo Website App
      redirect-uris:
        - http://127.0.0.1:9090/login/oauth2/code/web-app-demo
      scopes: profile
  # External client-credential verification (FR-16). When enabled, the client secret is verified by
  # POSTing {clientId, clientSecret} to the URL; a 2xx response carrying an accountId means valid,
  # anything else is invalid_client. The app.web-clients[].client-secret values are then unused.
  client-registry:
    enabled: false
    # url: http://client-registry.internal/api/verify

logging:
  level:
    org.springframework.security: info
    org.springframework.security.oauth2: info
